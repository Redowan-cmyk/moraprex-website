<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical specification illustration of Moraprex tailored chinos, cargo pants, and trousers">
  <defs>
    <linearGradient id="bg-pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#E7E1D6"/>
    </linearGradient>
    <pattern id="grid-pants" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D7CFC2" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg-pants)"/>
  <rect width="800" height="600" fill="url(#grid-pants)" opacity="0.65"/>
  <!-- Left Chino Silhouette -->
  <g transform="translate(135, 95)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 35 0 L 185 0 L 195 36 L 205 220 L 210 390 L 138 390 L 112 165 L 88 390 L 16 390 L 22 220 L 30 36 Z" fill="#C4AE8E"/>
    <path d="M 35 28 L 185 28" stroke="#1E293B" stroke-width="2"/>
    <path d="M 110 28 L 110 105" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M 36 32 Q 62 72 44 105" fill="none" stroke="#1E293B" stroke-width="1.8"/>
    <path d="M 184 32 Q 158 72 176 105" fill="none" stroke="#1E293B" stroke-width="1.8"/>
    <!-- Belt loops -->
    <rect x="52" y="2" width="7" height="24" fill="#B29977"/>
    <rect x="106" y="2" width="7" height="24" fill="#B29977"/>
    <rect x="160" y="2" width="7" height="24" fill="#B29977"/>
  </g>
  <!-- Right Cargo / Tailored Trouser Silhouette -->
  <g transform="translate(445, 95)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 35 0 L 185 0 L 195 36 L 206 220 L 210 390 L 138 390 L 112 165 L 88 390 L 16 390 L 22 220 L 30 36 Z" fill="#4A5548"/>
    <path d="M 35 28 L 185 28" stroke="#111827" stroke-width="2"/>
    <path d="M 110 28 L 110 108" stroke="#111827" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- Cargo pockets -->
    <rect x="20" y="160" width="42" height="58" rx="3" fill="#3E483C"/>
    <path d="M 20 176 L 62 176" stroke="#111827" stroke-width="1.8"/>
    <rect x="158" y="160" width="42" height="58" rx="3" fill="#3E483C"/>
    <path d="M 158 176 L 200 176" stroke="#111827" stroke-width="1.8"/>
  </g>
  <!-- Technical Callouts -->
  <g font-family="monospace" font-size="12" fill="#334155">
    <text x="40" y="48" font-weight="bold" letter-spacing="2">SPEC // WOVEN BOTTOMS &amp; CHINOS</text>
    <text x="40" y="558">98% COTTON / 2% ELASTANE TWILL  •  240–310 GSM  •  ENZYME PEACH FINISH</text>
  </g>
</svg>
