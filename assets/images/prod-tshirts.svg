<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical specification illustration of Moraprex heavyweight cotton t-shirts and knitwear">
  <defs>
    <linearGradient id="bg-tee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3EE"/>
      <stop offset="100%" stop-color="#E6E0D4"/>
    </linearGradient>
    <pattern id="grid-tee" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D8D0C3" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg-tee)"/>
  <rect width="800" height="600" fill="url(#grid-tee)" opacity="0.65"/>
  <!-- Boxy Heavyweight Tee -->
  <g transform="translate(180, 95)" stroke="#111315" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 140 16 Q 220 55 300 16 L 365 38 L 435 125 L 368 182 L 330 142 L 330 390 L 110 390 L 110 142 L 72 182 L 5 125 L 75 38 Z" fill="#2A3439"/>
    <!-- Ribbed Crew Neck -->
    <path d="M 140 16 Q 220 75 300 16" fill="none" stroke="#111315" stroke-width="2.5"/>
    <path d="M 152 22 Q 220 62 288 22" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Drop shoulder & hem twin-needle stitch -->
    <path d="M 110 142 L 85 52" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 330 142 L 355 52" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 112 372 L 328 372" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <!-- Dimension Lines -->
  <g stroke="#B86B43" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="290" y1="505" x2="510" y2="505"/>
    <line x1="150" y1="115" x2="150" y2="485"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#334155">
    <text x="40" y="48" font-weight="bold" letter-spacing="2">SPEC // HEAVYWEIGHT JERSEY &amp; KNITWEAR</text>
    <text x="40" y="558">100% COMBED ORGANIC COTTON  •  180–320 GSM  •  TWIN-NEEDLE COVERSTITCH</text>
  </g>
</svg>
