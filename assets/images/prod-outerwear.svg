<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical specification illustration of Moraprex outerwear, fleece hoodies, and technical jackets">
  <defs>
    <linearGradient id="bg-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F3F4"/>
      <stop offset="100%" stop-color="#E0E3E6"/>
    </linearGradient>
    <pattern id="grid-outer" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD1D6" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg-outer)"/>
  <rect width="800" height="600" fill="url(#grid-outer)" opacity="0.65"/>
  <!-- Technical Shell Jacket -->
  <g transform="translate(170, 75)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Hood -->
    <path d="M 168 35 Q 230 -15 292 35 L 275 68 L 185 68 Z" fill="#1E293B"/>
    <!-- Body -->
    <path d="M 168 35 L 292 35 L 368 62 L 448 258 L 398 278 L 348 150 L 348 415 L 112 415 L 112 150 L 62 278 L 12 258 L 92 62 Z" fill="#334155"/>
    <!-- Seam-sealed center zip & storm flap -->
    <line x1="230" y1="68" x2="230" y2="415" stroke="#B86B43" stroke-width="3"/>
    <!-- Quilted / bonded panel lines -->
    <line x1="112" y1="190" x2="348" y2="190" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="112" y1="295" x2="348" y2="295" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- Zippered pockets -->
    <line x1="138" y1="255" x2="180" y2="330" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="322" y1="255" x2="280" y2="330" stroke="#CBD5E1" stroke-width="3"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#334155">
    <text x="40" y="48" font-weight="bold" letter-spacing="2">SPEC // OUTERWEAR, FLEECE &amp; ACTIVEWEAR</text>
    <text x="40" y="558">3-LAYER DWR SHELL &amp; 450 GSM FRENCH TERRY  •  SEAM-TAPED  •  YKK AQUAGUARD</text>
  </g>
</svg>
